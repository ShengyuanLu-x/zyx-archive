<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>张艺兴考古网站（Phase 0 测试版）</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="张艺兴考古" />
</head>
<body>
  <header class="site-header">

    <p class="tagline">Phase 0 技术测试版 · 跨平台资料导航</p>
    <div class="site-search">

    <nav class="breadcrumb" id="breadcrumb"></nav>
    <h2 class="page-title" id="page-title"></h2>
    <p class="intro-quote" id="intro"></p>
    <p id="status">正在加载资料…</p>
    <div id="node-grid" class="node-grid"></div>
  </main>
  <footer class="site-footer">测试版本，资料均为示例/占位链接。</footer>

  <script src="js/common.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/category.js"></script>
  <script src="js/search.js"></script>

</html>
